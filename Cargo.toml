[package]
name = "hermes_skill_brain"
version = "0.2.0"
edition = "2021"
authors = ["Alif Yudha <Crashzyy@users.noreply.github.com>"]
description = "Rust core engine for the Hermes auto_skill_selector plugin (Fase 2): strict 6-stage prompt->skill router (bypass, pin, global negation sieve, clause split, 4-mode BM25F+MNB+centroid scoring, 6-state decision gate)."
license = "MIT"

[lib]
name = "hermes_skill_brain"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
