[package]
name = "hermes_skill_brain"
version = "0.1.0"
edition = "2021"
authors = ["Alif Yudha <Crashzyy@users.noreply.github.com>"]
description = "Rust core engine for the Hermes auto_skill_selector plugin: 5-layer BM25F + MNB + Dice prompt->skill router."
license = "MIT"

[lib]
name = "hermes_skill_brain"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
